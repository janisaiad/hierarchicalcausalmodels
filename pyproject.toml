[project]
name = "hierarchicalcausalmodels"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "causal-learn>=0.1.4.0",
    "causalgraphicalmodels",
    "jax[cuda12]>=0.8.2",
    "ipykernel>=7.0.0",
    "jupyter>=1.1.1",
    "jupytext>=1.18.1",
    "lime>=0.2.0.1",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.3.0,<2.4",
    "numpyro>=0.19.0",
    "pdoc>=16.0.0",
    "polars>=1.37.0",
    "pyagrum>=2.3.2",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "scikit-learn>=1.8.0",
    "shap>=0.50.0",
    "fasttreeshap-fixed>=0.1.4",
    "tach>=0.33.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "ty>=0.0.11",
    "plotly>=6.6.0",
    "dowhy>=0.14",
    "cdt>=0.6.0",
]

[project.optional-dependencies]
speed = [
    "numba>=0.62.0",
]

[tool.uv]
# Évite que le résolveur tire llvmlite 0.36 (incompatible Python 3.13) via une chaîne transitive vers shap/numba.
override-dependencies = ["llvmlite>=0.43.0", "numba>=0.62.0"]

[tool.uv.sources]
causalgraphicalmodels = { git = "https://github.com/janisaiad/causalgraphicalmodels.git" }
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true





[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"



[tool.setuptools]
package-dir = {hierarchicalcausalmodels = "src/hierarchicalcausalmodels/"} # you can write inside the brackets something like "Model1" = "models/model1/", "Model2" = "models/model2/"
packages = ["hierarchicalcausalmodels"] # same, smth like ["Model1", "Model2"]



[tool.setuptools.package-data]
"*" = ["*.py", "*.pyi", "*.c", "*.h", "*.cpp", "*.hpp"]

[tool.pytest.ini_options]
markers = [
    "slow: optional tests that call estimate_causal_effect or large loops",
]

